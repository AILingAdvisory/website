<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="256" height="256" rx="56" fill="#070b14" />
  <rect width="254" height="254" x="1" y="1" rx="55" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Monogram: Stylized A + L -->
  <!-- Cyan L-stroke (Left leg and horizontal base) -->
  <path d="M 128 42 L 52 204 L 144 204" 
        fill="none" 
        stroke="url(#cyan-grad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- White Right Leg of 'A' -->
  <path d="M 136 56 L 204 204" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="28" 
        stroke-linecap="round" />
</svg>
